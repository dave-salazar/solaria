<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>Shop | Solaria Parfums</title><meta name="description" content="Solaria Parfums - luxury-inspired fragrances, made accessible. Delivered across the Philippines."><meta property="og:site_name" content="Solaria Parfums"><meta property="og:title" content="Shop | Solaria Parfums"></head>
<body data-nav="shop"><div id="hdr"></div><main>
<section class="page-head"><div class="wrap"><p class="eyebrow">The collection</p><h1>All fragrances</h1></div></section>
<section class="sec" style="padding-top:44px"><div class="wrap">
<div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:22px">
 <div class="chips" id="forChips"></div>
 <div style="display:flex;gap:22px;flex-wrap:wrap;min-width:min(100%,420px)"><div style="flex:1;min-width:150px"><label style="margin-top:0">Search</label><input id="q" type="text" placeholder="Name or inspired by"></div>
 <div style="min-width:150px"><label style="margin-top:0">Sort</label><select id="sort"><option value="new">Newest</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option><option value="az">Name A-Z</option></select></div></div>
</div>
<div class="chips" id="famChips" style="margin-bottom:40px"></div>
<p class="muted" id="count" style="font-size:12px;margin:0 0 22px"></p>
<div class="grid" id="grid"></div>
<div class="center muted hide" id="none" style="padding:60px 0">No fragrances match your search.</div>
</div></section>
</main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script src="cart.js"></script><script src="layout.js"></script><script>
var all=[],ratings={},st={for:"All",fam:"All",q:"",sort:"new"};
var U=new URLSearchParams(location.search);
if(U.get("for"))st.for=U.get("for");if(U.get("family"))st.fam=U.get("family");if(U.get("q"))st.q=U.get("q");
document.getElementById("q").value=st.q;
function chips(id,list,key){
  document.getElementById(id).innerHTML=list.map(function(v){return '<button class="chip'+(st[key]===v?' on':'')+'" data-v="'+SOL.esc(v)+'">'+SOL.esc(v)+'</button>'}).join("");
  document.querySelectorAll("#"+id+" .chip").forEach(function(b){b.onclick=function(){st[key]=b.dataset.v;draw()}});
}
function draw(){
  chips("forChips",["All","Men","Women","Unisex"],"for");
  var fams=["All"];all.forEach(function(p){var f=(p.family||"").split(/[ &,]+/)[0];if(f&&fams.indexOf(f)<0)fams.push(f)});
  chips("famChips",fams,"fam");
  var q=st.q.trim().toLowerCase();
  var rows=all.filter(function(p){
    if(st.for!=="All"&&p.shop_for!==st.for)return false;
    if(st.fam!=="All"&&(p.family||"").toLowerCase().indexOf(st.fam.toLowerCase())<0)return false;
    if(q&&((p.name||"")+" "+(p.inspired_by||"")+" "+(p.family||"")).toLowerCase().indexOf(q)<0)return false;return true});
  var min=function(p){return p.variants.length?Math.min.apply(null,p.variants.map(function(v){return +v.price})):0};
  rows.sort(function(a,b){return st.sort==="lo"?min(a)-min(b):st.sort==="hi"?min(b)-min(a):st.sort==="az"?a.name.localeCompare(b.name):new Date(b.added_at)-new Date(a.added_at)});
  document.getElementById("grid").innerHTML=rows.map(function(p){return SOLCard(p,ratings)}).join("");
  document.getElementById("none").classList.toggle("hide",rows.length>0);
  document.getElementById("count").textContent=rows.length+" fragrance"+(rows.length===1?"":"s");
}
document.getElementById("q").oninput=function(e){st.q=e.target.value;draw()};
document.getElementById("sort").onchange=function(e){st.sort=e.target.value;draw()};
async function load(){
  if(!SOLDB.ok){document.getElementById("none").classList.remove("hide");document.getElementById("none").textContent="Our collection is arriving soon.";return}
  try{all=await SOLDB.fetchProducts();ratings=await SOLDB.fetchRatings();draw()}catch(e){document.getElementById("none").classList.remove("hide");document.getElementById("none").textContent="Could not load the collection right now."}
}
load();SOLDB.watch&&SOLDB.watch(load,["products","product_variants"]);
</script></body></html>
