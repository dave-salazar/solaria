<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>Admin | Solaria Parfums</title><meta name="description" content="Solaria Parfums - luxury-inspired fragrances, made accessible. Delivered across the Philippines."><meta property="og:site_name" content="Solaria Parfums"><meta property="og:title" content="Admin | Solaria Parfums"></head>
<body data-nav=""><div id="hdr"></div><main>
<section class="page-head"><div class="wrap"><p class="eyebrow">Solaria</p><h1>Admin</h1></div></section>
<section class="sec" style="padding-top:36px"><div class="wrap" id="ad"><p class="muted center">Loading&hellip;</p></div></section>
<style>.vr{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}.ovf{overflow-x:auto}@media(max-width:700px){.two{grid-template-columns:1fr}}</style>
</main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script src="cart.js"></script><script src="layout.js"></script><script>
var ad=document.getElementById("ad"),C=null,tab="products",prods=[],edit=null;
(async function(){
  if(!SOLDB.ok){ad.innerHTML='<p class="muted center">Connect Supabase first (see the setup guide).</p>';return}
  if(!(await SOLDB.requireLogin("admin.html")))return;
  if(!(await SOLDB.isAdmin())){ad.innerHTML='<p class="muted center">This area is for Solaria staff only.</p>';return}
  C=SOLDB.client;shell();show();
})();
function shell(){ad.innerHTML='<div class="chips" style="margin-bottom:32px">'+["products","orders","messages"].map(function(t){return '<button class="chip" data-t="'+t+'">'+t+'</button>'}).join("")+'</div><div id="ab"></div>';
  ad.querySelectorAll("[data-t]").forEach(function(b){b.onclick=function(){tab=b.dataset.t;edit=null;show()}})}
function show(){ad.querySelectorAll("[data-t]").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab)});({products:products,orders:orders,messages:messages})[tab]()}
async function products(){
  var b=document.getElementById("ab");if(edit)return form();
  var r=await C.from("products").select("*, product_variants(*)").order("id");prods=r.data||[];
  b.innerHTML='<button class="btn sm" id="new" style="margin-bottom:22px">Add fragrance</button><div class="ovf"><table><tr><th>Name</th><th>Inspired by</th><th>Sizes (ml / price / stock)</th><th>Status</th><th></th></tr>'+prods.map(function(p){return '<tr><td>'+SOL.esc(p.name)+'</td><td class="muted">'+SOL.esc(p.inspired_by||"")+'</td><td class="muted">'+(p.product_variants||[]).sort(function(a,b){return a.ml-b.ml}).map(function(v){return v.ml+" / "+v.price+" / "+v.stock}).join("<br>")+'</td><td>'+p.status+'</td><td style="white-space:nowrap"><a href="#" data-e="'+p.id+'" style="color:var(--gold)">Edit</a> &nbsp; <a href="#" data-x="'+p.id+'" style="color:var(--err)">Delete</a></td></tr>'}).join("")+'</table></div>';
  document.getElementById("new").onclick=function(){edit={variants:[{ml:30},{ml:50},{ml:100}],status:"active",shop_for:"Unisex",concentration:"Eau de Parfum"};products()};
  b.querySelectorAll("[data-e]").forEach(function(a){a.onclick=function(e){e.preventDefault();var p=prods.filter(function(x){return String(x.id)===a.dataset.e})[0];edit=Object.assign({},p,{variants:p.product_variants.slice().sort(function(a,b){return a.ml-b.ml})});products()}});
  b.querySelectorAll("[data-x]").forEach(function(a){a.onclick=async function(e){e.preventDefault();if(confirm("Delete this fragrance permanently? (Use Hidden status to just take it off the shop.)")){var d=await C.from("products").delete().eq("id",a.dataset.x);if(d.error)SOL.toast("Could not delete");products()}}});
}
function form(){
  var b=document.getElementById("ab"),p=edit;
  function t(l,k,ph){return '<div><label>'+l+'</label><input data-k="'+k+'" type="text" value="'+SOL.esc(p[k]||"")+'" placeholder="'+(ph||"")+'"></div>'}
  function s(l,k,o){return '<div><label>'+l+'</label><select data-k="'+k+'">'+o.map(function(x){return '<option'+(p[k]===x?' selected':'')+'>'+x+'</option>'}).join("")+'</select></div>'}
  b.innerHTML='<div class="panel"><h3>'+(p.id?"Edit":"New")+' fragrance</h3><div class="rule"></div><div class="two">'+t("Name","name")+t("Inspired by (original perfume)","inspired_by","e.g. Dior Sauvage")+t("Scent family","family","Woody, Floral, Fresh...")+s("For","shop_for",["Men","Women","Unisex"])+t("Concentration","concentration")+s("Status","status",["active","hidden"])+t("Top notes","top_notes")+t("Heart notes","heart_notes")+t("Base notes","base_notes")+'</div>'+
   '<label>Description</label><textarea data-k="description">'+SOL.esc(p.description||"")+'</textarea>'+
   '<label>Photo</label>'+(p.image_url?'<img src="'+SOL.esc(p.image_url)+'" style="width:90px;margin-bottom:8px" alt="">':'')+'<input id="img" type="file" accept="image/*">'+
   '<div style="display:flex;gap:30px;margin-top:18px"><label style="display:flex;gap:8px;align-items:center;margin:0"><input style="width:auto" type="checkbox" id="ft"'+(p.is_featured?' checked':'')+'> Featured on home</label><label style="display:flex;gap:8px;align-items:center;margin:0"><input style="width:auto" type="checkbox" id="nw"'+(p.is_new?' checked':'')+'> New badge</label></div>'+
   '<label>Sizes (leave ml empty to remove a size)</label><div id="vs">'+p.variants.map(vrow).join("")+'</div><button class="btn sm ghost" id="av" style="margin-top:12px">Add size</button><div class="err" id="fe"></div>'+
   '<div style="display:flex;gap:14px;margin-top:10px"><button class="btn sm" id="sv">Save</button><button class="btn sm ghost" id="cn">Cancel</button></div></div>';
  function vrow(v){return '<div class="vr" style="margin-bottom:6px"><div><input data-v="ml" type="text" placeholder="ml" value="'+(v.ml||"")+'"></div><div><input data-v="price" type="text" placeholder="Price (PHP)" value="'+(v.price==null?"":v.price)+'"></div><div><input data-v="stock" type="text" placeholder="Stock" value="'+(v.stock==null?"":v.stock)+'"></div><span></span></div>'}
  document.getElementById("av").onclick=function(){document.getElementById("vs").insertAdjacentHTML("beforeend",vrow({}))};
  document.getElementById("cn").onclick=function(){edit=null;products()};
  document.getElementById("sv").onclick=save;
}
async function save(){
  var p=edit,e=document.getElementById("fe"),row={};e.textContent="";
  document.querySelectorAll("#ab [data-k]").forEach(function(n){row[n.dataset.k]=n.value.trim()||null});
  if(!row.name){e.textContent="Name is required.";return}
  row.is_featured=document.getElementById("ft").checked;row.is_new=document.getElementById("nw").checked;
  var vs=[];document.querySelectorAll("#vs .vr").forEach(function(r){var g=function(k){return r.querySelector('[data-v="'+k+'"]').value.trim()};if(g("ml"))vs.push({ml:parseInt(g("ml"),10),price:Number(g("price")),stock:parseInt(g("stock")||"0",10)})});
  if(!vs.length||vs.some(function(v){return !(v.ml>0)||!(v.price>=0)||!(v.stock>=0)})){e.textContent="Add at least one valid size (ml, price, stock).";return}
  var f=document.getElementById("img").files[0];
  try{
    if(f){var path=Date.now()+"-"+f.name.replace(/[^a-z0-9._-]/gi,"_"),u=await C.storage.from("product-images").upload(path,f);if(u.error)throw u.error;row.image_url=C.storage.from("product-images").getPublicUrl(path).data.publicUrl}
    else row.image_url=p.image_url||null;
    var q=p.id?await C.from("products").update(row).eq("id",p.id).select().single():await C.from("products").insert(row).select().single();
    if(q.error)throw q.error;var id=q.data.id;
    var keep=vs.map(function(v){return v.ml});
    var old=await C.from("product_variants").select("id,ml").eq("product_id",id);
    var gone=(old.data||[]).filter(function(o){return keep.indexOf(o.ml)<0}).map(function(o){return o.id});
    if(gone.length){var dl=await C.from("product_variants").delete().in("id",gone);if(dl.error)throw dl.error}
    var up=await C.from("product_variants").upsert(vs.map(function(v){return Object.assign({product_id:id},v)}),{onConflict:"product_id,ml"});if(up.error)throw up.error;
    edit=null;SOL.toast("Saved");products();
  }catch(x){e.textContent="Could not save: "+(x.message||x)}
}
async function orders(){
  var b=document.getElementById("ab"),r=await C.from("orders").select("*, order_items(*)").order("created_at",{ascending:false}).limit(100),S=["pending","paid","shipped","delivered","cancelled"];
  b.innerHTML='<div class="ovf"><table><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>'+(r.data||[]).map(function(o){return '<tr><td>'+SOL.esc(o.id)+'<div class="muted" style="font-size:11px">'+new Date(o.created_at).toLocaleString()+'</div></td><td>'+SOL.esc(o.customer_name||"")+'<div class="muted" style="font-size:11px">'+SOL.esc([o.customer_phone,o.address_line,o.city,o.province].filter(Boolean).join(", "))+'</div></td><td class="muted">'+(o.order_items||[]).map(function(i){return SOL.esc(i.name)+" "+i.ml+"ml x"+i.qty}).join("<br>")+'</td><td>'+SOL.peso(o.total)+'</td><td><select data-o="'+SOL.esc(o.id)+'">'+S.map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+s+'</option>'}).join("")+'</select></td></tr>'}).join("")+'</table></div>';
  b.querySelectorAll("[data-o]").forEach(function(s){s.onchange=async function(){var x=await C.rpc("set_order_status",{p_id:s.dataset.o,p_status:s.value});SOL.toast(x.error?"Could not change status":"Status updated");orders()}});
}
async function messages(){
  var b=document.getElementById("ab"),r=await C.from("contact_messages").select("*").order("created_at",{ascending:false}).limit(100);
  b.innerHTML=(r.data||[]).length?(r.data).map(function(m){return '<div class="panel" style="margin-bottom:16px"><b style="font-weight:500">'+SOL.esc(m.name)+'</b> <a href="mailto:'+SOL.esc(m.email)+'" style="color:var(--gold)">'+SOL.esc(m.email)+'</a> <span class="muted" style="font-size:12px">&middot; '+new Date(m.created_at).toLocaleString()+'</span><p class="muted" style="margin:10px 0 0;white-space:pre-wrap">'+SOL.esc(m.message)+'</p></div>'}).join(""):'<p class="muted">No messages yet.</p>';
}
</script></body></html>
