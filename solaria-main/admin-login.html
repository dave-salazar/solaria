<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>Admin sign in | Solaria</title><meta name="robots" content="noindex,nofollow"></head>
<body><main><section class="sec"><div class="wrap" style="max-width:420px">
<div class="center"><img class="logo-img" src="logo-emblem.png" alt="" style="width:70px;margin:0 auto 20px"><p class="eyebrow">Staff only</p><h2>Admin sign in</h2><div class="rule"></div></div>
<label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password">
<div class="err center" id="er"></div><button class="btn block" id="go" style="margin-top:24px">Sign in</button>
<p class="center muted" style="margin-top:24px;font-size:12px"><a href="index.html" style="color:var(--gold)">Back to store</a></p>
</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script>
var er=document.getElementById("er"),go=document.getElementById("go");
async function run(){er.textContent="";if(!SOLDB.ok){er.textContent="Not connected.";return}go.disabled=true;
  try{await SOLDB.adminSignIn(document.getElementById("em").value.trim(),document.getElementById("pw").value);location.href="admin.html"}
  catch(e){er.textContent="Invalid credentials or no admin access."}go.disabled=false}
go.onclick=run;document.addEventListener("keydown",function(e){if(e.key==="Enter")run()});
if(SOLDB.ok)SOLDB.adminOk().then(function(ok){if(ok)location.href="admin.html"});
</script></body></html>
