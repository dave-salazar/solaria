<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>My orders | Solaria Parfums</title><meta name="description" content="Solaria Parfums - luxury-inspired fragrances, made accessible. Delivered across the Philippines."><meta property="og:site_name" content="Solaria Parfums"><meta property="og:title" content="My orders | Solaria Parfums"></head>
<body data-nav=""><div id="hdr"></div><main>
<section class="page-head"><div class="wrap"><p class="eyebrow">Account</p><h1>My orders</h1></div></section>
<section class="sec" style="padding-top:48px"><div class="wrap" style="max-width:860px" id="or"></div></section>
</main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script src="cart.js"></script><script src="layout.js"></script><script>
var or_=document.getElementById("or");
async function load(){
  var u=await SOLDB.requireLogin("orders.html");if(!u)return;
  var rows=await SOLDB.myOrders();
  or_.innerHTML=rows.length?rows.map(function(o){return '<div class="panel" style="margin-bottom:22px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><b style="font-weight:500;letter-spacing:.06em">'+SOL.esc(o.id)+'</b><div class="muted" style="font-size:12px">'+new Date(o.created_at).toLocaleDateString()+'</div></div><div style="text-align:right"><span class="chip on" style="padding:4px 12px">'+SOL.esc(o.status==="to_receive"?"to receive":o.status)+'</span><div style="color:var(--gold);margin-top:6px">'+SOL.peso(o.total)+'</div></div></div><div class="rule"></div>'+
   (o.order_items||[]).map(function(i){return '<div class="row" style="display:flex;justify-content:space-between;font-size:13px;padding:4px 0"><span><a href="product.html?id='+SOL.esc(i.product_id)+'" style="text-decoration:underline">'+SOL.esc(i.name)+'</a> <span class="muted">&middot; '+i.ml+' ml &times; '+i.qty+'</span></span><span>'+SOL.peso(i.price*i.qty)+'</span></div>'}).join("")+
   '<p class="muted" style="font-size:12px;margin:14px 0 0">'+SOL.esc([o.customer_name,o.address_line,o.city,o.province].filter(Boolean).join(", "))+'</p>'+
   (o.status==="pending"?'<button class="btn sm ghost" style="margin-top:16px" data-c="'+SOL.esc(o.id)+'">Cancel order</button>':'')+
   (o.status==="to_receive"?'<p class="muted" style="font-size:12px;margin:14px 0 0">Your order is on its way. Tap below once you have received it and paid.</p><button class="btn sm" style="margin-top:12px" data-r="'+SOL.esc(o.id)+'">Order received</button>':'')+
   (o.status==="delivered"?'<p class="muted" style="font-size:12px;margin:12px 0 0">Open a fragrance above to leave a review.</p>':'')+'</div>'}).join(""):'<div class="center"><p class="muted">You have not placed any orders yet.</p><a class="btn" href="shop.html" style="margin-top:20px">Start shopping</a></div>';
  or_.querySelectorAll("[data-r]").forEach(function(b){b.onclick=async function(){if(!confirm("Confirm that you received this order? This marks it as paid."))return;try{await SOLDB.received(b.dataset.r);SOL.toast("Thank you! Order marked as received");load()}catch(e){SOL.toast("Could not confirm this order: "+(e&&e.message?e.message:""))}}});
  or_.querySelectorAll("[data-c]").forEach(function(b){b.onclick=async function(){if(!confirm("Cancel this order?"))return;try{await SOLDB.cancel(b.dataset.c);SOL.toast("Order cancelled");load()}catch(e){SOL.toast("This order can no longer be cancelled")}}});
}
if(SOLDB.ok){load();SOLDB.watch(load,["orders"])}else or_.innerHTML='<p class="muted center">The shop is not connected yet.</p>';
</script></body></html>
