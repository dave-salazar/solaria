<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>My account | Solaria Parfums</title><meta name="description" content="Solaria Parfums - luxury-inspired fragrances, made accessible. Delivered across the Philippines."><meta property="og:site_name" content="Solaria Parfums"><meta property="og:title" content="My account | Solaria Parfums"><style>
.arow{padding:14px 0;border-bottom:1px solid var(--line)}.arow:last-of-type{border-bottom:0}
.arow-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.alab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.aval{font-size:15px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;word-break:break-all}
.aedit{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;margin:-6px}.aedit:hover,.aedit.on{color:var(--gold)}
.aform{padding-top:6px}.aact{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;padding:5px 12px;border-radius:99px;background:rgba(201,169,110,.14);color:var(--gold);white-space:nowrap}
.gender{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.gender button{background:none;border:0;color:var(--muted);padding:16px 0;cursor:pointer;display:flex;justify-content:center;transition:.2s}
.gender button+button{border-left:1px solid var(--line)}
.gender button[aria-pressed="true"]{color:var(--gold);background:rgba(201,169,110,.12);box-shadow:inset 0 0 0 1px var(--gold)}
.mo{position:fixed;inset:0;z-index:1000;background:rgba(10,10,12,.72);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:mof .18s ease}
.mc{width:100%;max-width:420px;max-height:90vh;overflow:auto;background:var(--card);border:1px solid var(--line);padding:26px;animation:mop .2s ease}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}.mh h3{margin:0}
.mx{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px;margin:-6px}.mx:hover{color:var(--gold)}
.mb{width:100%;margin-top:18px}.mb[disabled]{opacity:.6;cursor:wait}
input.cal{cursor:pointer;caret-color:transparent}
@keyframes mof{from{opacity:0}}@keyframes mop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.panel .rule{width:100%;height:1px;margin:20px 0 28px;position:relative;background:linear-gradient(90deg,var(--gold),transparent)}
.panel .rule::before{content:"";position:absolute;left:0;top:50%;width:7px;height:7px;background:var(--gold);transform:translateY(-50%) rotate(45deg);box-shadow:0 0 0 3px var(--card)}
</style>
</head>
<body data-nav=""><div id="hdr"></div><main>
<section class="page-head"><div class="wrap"><p class="eyebrow">Account</p><h1>My account</h1></div></section>
<section class="sec" style="padding-top:48px"><div class="wrap" style="max-width:820px" id="ar"></div></section>
</main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script src="cart.js"></script><script src="layout.js"></script><script>
var ar=document.getElementById("ar"),user=null;
function pw(id){return '<div class="pw-wrap"><input id="'+id+'" type="password" placeholder=" " autocomplete="new-password"><button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false"><svg class="eye-on" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></button></div>'}
(async function(){
  if(!SOLDB.ok){ar.innerHTML='<p class="muted center">The shop is not connected yet.</p>';return}
  user=await SOLDB.requireLogin("account.html");if(!user)return;
  var admin=await SOLDB.isAdmin(),md=user.user_metadata||{};
  var ico='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>';
  function chip(t){return '<span class="chip"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'+t+'</span>'}
  function row(k,label,val,bdg,form){return '<div class="arow" id="r-'+k+'"><div class="arow-h"><div><div class="alab">'+label+'</div><div class="aval" id="v-'+k+'">'+val+(bdg?' '+bdg:'')+'</div></div><button type="button" class="aedit" data-r="'+k+'" aria-label="Edit '+label+'">'+ico+'</button></div><div class="aform hide" id="f-'+k+'">'+form+'</div></div>'}
  function acts(k,id){return '<div class="err" id="'+k+'e"></div><div class="aact"><button type="button" class="btn sm" id="'+id+'">Save</button><button type="button" class="btn sm ghost" data-c="'+k+'">Cancel</button></div>'}
  function mask(e){var p=String(e||"").split("@");return p.length<2?e:p[0].charAt(0)+"*".repeat(Math.max(p[0].length-1,3))+"@"+p[1]}
  function ageOf(b){if(!b)return null;var d=new Date(b+"T00:00:00");if(isNaN(d))return null;var n=new Date(),a=n.getFullYear()-d.getFullYear(),m=n.getMonth()-d.getMonth();if(m<0||(m===0&&n.getDate()<d.getDate()))a--;return a}
  function group(a){return a===null?"":a>=21?"21+":a>=18?"18+":a>=13?"13+":"Under 13"}
  function bdText(b){if(!b)return'<span class="muted">Not set</span>';return new Date(b+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
  function ageHTML(b){var a=ageOf(b);return a===null?'<span class="muted">Add your birthday</span>':a+' years old'}
  function grpHTML(b){var a=ageOf(b);return a===null?'<span class="muted">Not set</span>':group(a)+' '+chip("Checked")}
  var maleI='<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.5"/><path d="M7 9h10l-1 6h-2v6h-4v-6H8z"/></svg>';
  var femaleI='<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="4.5" r="2.5"/><path d="M12 9l4 6h-2.5v6h-3v-6H8z"/><path d="M7 15h10"/></svg>';
  var bd=md.birthday||"",today=new Date().toISOString().slice(0,10);
  ar.innerHTML='<div class="panel"><h3>Profile</h3><div class="rule"></div>'+
   row("un","Username",SOL.esc(md.username||"—"),"","")+
   row("em","Email",SOL.esc(mask(user.email)),user.email_confirmed_at?chip("Verified"):"","")+
   row("pw","Password","*******","","")+
   '<label>Full name</label><input id="pn" type="text" value="'+SOL.esc(md.full_name||"")+'"><label>Mobile number</label>'+SOL.phoneHTML("pp",md.phone)+'<div class="err" id="pe"></div><button class="btn sm" id="ps">Save</button></div>'+
   '<div class="panel" style="margin-top:28px"><h3>Personal</h3><div class="rule"></div>'+
   '<div class="arow"><div class="alab">Age group</div><div class="aval" id="v-ag">'+grpHTML(bd)+'</div></div>'+
   '<div class="arow"><div class="alab">Age</div><div class="aval" id="v-age">'+ageHTML(bd)+'</div></div>'+
   row("bd","Birthday",bdText(bd),bd?chip("Saved"):"","")+
   '<div class="arow"><div class="alab">Gender (optional)</div><div class="gender" id="gd"><button type="button" data-g="male" aria-label="Male" aria-pressed="'+(md.gender==="male")+'">'+maleI+'</button><button type="button" data-g="female" aria-label="Female" aria-pressed="'+(md.gender==="female")+'">'+femaleI+'</button></div><div class="muted hint">Tap again to clear.</div></div></div>'+
   '<div class="panel" style="margin-top:28px"><h3>Addresses</h3><div class="rule"></div><div id="al"></div><button class="btn sm ghost" id="an" style="margin-top:14px">Add address</button></div>'+
   '<div style="margin-top:32px;display:flex;gap:14px;flex-wrap:wrap"><a class="btn ghost sm" href="orders.html">My orders</a>'+'<button class="btn ghost sm" id="so">Sign out</button></div>';
  function $(i){return document.getElementById(i)}
  function toggle(k,on){$("f-"+k).classList.toggle("hide",!on);$("v-"+k)&&($("v-"+k).parentNode.parentNode.querySelector(".aedit").classList.toggle("on",on))}
  function modal(title,body,btn,submit){
    var old=document.querySelector(".mo");if(old)old.remove();
    var o=document.createElement("div");o.className="mo";
    o.innerHTML='<div class="mc" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="mh"><h3>'+title+'</h3><button type="button" class="mx" aria-label="Close"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>'+body+'<div class="err" id="me"></div><button type="button" class="btn sm mb" id="mb">'+btn+'</button></div>';
    document.body.appendChild(o);document.body.style.overflow="hidden";
    function close(){o.remove();document.body.style.overflow="";document.removeEventListener("keydown",esc)}
    function esc(e){if(e.key==="Escape")close()}
    document.addEventListener("keydown",esc);
    o.onclick=function(e){if(e.target===o)close()};
    o.querySelector(".mx").onclick=close;
    o.querySelectorAll(".pw-eye").forEach(function(b){b.onclick=function(){var i=b.parentNode.querySelector("input"),show=i.type==="password";i.type=show?"text":"password";b.classList.toggle("on",show);b.setAttribute("aria-pressed",show)}});
    var mb=o.querySelector("#mb"),me=o.querySelector("#me");
    mb.onclick=async function(){mb.disabled=true;me.textContent="";try{var r=await submit(o);if(r){me.textContent=r}else close()}catch(x){me.textContent="Something went wrong. Please try again."}mb.disabled=false};
    o.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type!=="date")mb.click()});
    var f=o.querySelector("input");if(f)setTimeout(function(){f.focus()},50);
  }
  window.solModal=modal;window.solMd=md;
  var modals={
    em:function(){modal("Change email",'<label>New email address</label><input id="m1" type="email" autocomplete="email" value="'+SOL.esc(user.email)+'"><div class="muted hint">We will send a confirmation link to the new address.</div>',"Update",async function(o){
      var v=o.querySelector("#m1").value.trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return"Enter a valid email address.";
      if(v.toLowerCase()===String(user.email).toLowerCase())return null;
      await SOLDB.setEmail(v);SOL.toast("Check "+v+" to confirm the change");return null})},
    un:function(){modal("Change username",'<label>Username</label><input id="m1" type="text" autocomplete="username" value="'+SOL.esc(md.username||"")+'"><div class="muted hint">3-20 characters: lowercase letters, numbers, _ or . (no spaces)</div>',"Update",async function(o){
      var u=o.querySelector("#m1").value.trim().toLowerCase(),m=SOL.userCheck(u);if(m)return m;if(u===md.username)return null;
      await SOLDB.updateProfile({username:u});md.username=u;$("v-un").textContent=u;SOL.toast("Username updated");return null})},
    pw:function(){modal("Change password",'<label>Current password</label>'+pw("m0")+'<label>New password</label>'+pw("m1")+'<label>Confirm password</label>'+pw("m2")+'<div class="muted hint">'+SOL.PWHINT+'</div>',"Update",async function(o){
      var c=o.querySelector("#m0").value,p=o.querySelector("#m1").value,q=o.querySelector("#m2").value;
      if(!c)return"Enter your current password.";
      var pe=SOL.pwCheck(p,[user.email,md.username]);if(pe)return pe;
      if(p!==q)return"Passwords do not match.";if(p===c)return"New password must be different from the current one.";
      try{await SOLDB.checkPassword(user.email,c)}catch(x){return"Current password is incorrect."}
      await SOLDB.setPassword(p);SOL.toast("Password updated");return null})},
    bd:function(){modal("Change birthday",'<label>Birthday</label><input id="m1" type="date" class="cal" min="1900-01-01" max="'+today+'" value="'+SOL.esc(md.birthday||"")+'" inputmode="none" autocomplete="off"><div class="muted hint">Tap the field to pick a date from the calendar.</div>',"Update",async function(o){
      var v=o.querySelector("#m1").value,a=ageOf(v);if(!v||a===null)return"Pick your birthday from the calendar.";if(a<0||a>120)return"Enter a valid birthday.";
      await SOLDB.updateProfile({birthday:v});md.birthday=v;$("v-bd").innerHTML=bdText(v)+" "+chip("Saved");$("v-ag").innerHTML=grpHTML(v);$("v-age").innerHTML=ageHTML(v);SOL.toast("Birthday updated");return null});
      var d=document.querySelector(".mo #m1");function pick(){try{d.showPicker()}catch(e){}}
      d.addEventListener("click",pick);d.addEventListener("focus",pick);
      d.addEventListener("keydown",function(e){if(e.key!=="Tab"&&e.key!=="Escape"){e.preventDefault();if(e.key==="Enter"||e.key===" ")pick()}});
      d.addEventListener("paste",function(e){e.preventDefault()});d.addEventListener("beforeinput",function(e){e.preventDefault()})}
  };
  ar.querySelectorAll(".aedit").forEach(function(b){b.onclick=function(){var k=b.dataset.r;if(modals[k])modals[k]();else toggle(k,$("f-"+k).classList.contains("hide"))}});
  ar.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){toggle(b.dataset.c,false)}});
  $("gd").querySelectorAll("button").forEach(function(b){b.onclick=async function(){var cur=md.gender||"",nx=cur===b.dataset.g?"":b.dataset.g;try{await SOLDB.updateProfile({gender:nx});md.gender=nx;$("gd").querySelectorAll("button").forEach(function(o){o.setAttribute("aria-pressed",o.dataset.g===nx)});SOL.toast(nx?"Gender saved":"Gender cleared")}catch(x){SOL.toast("Could not save gender")}}});
  SOL.phoneBind("pp");
  document.getElementById("ps").onclick=async function(){var ph=SOL.phoneVal("pp");if(ph===null){document.getElementById("pe").textContent="Enter a valid mobile number for the selected country.";return}document.getElementById("pe").textContent="";try{await SOLDB.updateProfile({full_name:document.getElementById("pn").value,phone:ph});md.full_name=document.getElementById("pn").value;md.phone=ph;SOL.toast("Profile saved")}catch(e){document.getElementById("pe").textContent="Could not save."}};
  ar.querySelectorAll(".pw-eye").forEach(function(b){b.onclick=function(){var i=b.parentNode.querySelector("input"),show=i.type==="password";i.type=show?"text":"password";b.classList.toggle("on",show);b.setAttribute("aria-pressed",show);b.setAttribute("aria-label",show?"Hide password":"Show password")}});
  ar.querySelectorAll(".pw-wrap input").forEach(function(i){i.addEventListener("input",function(){if(!i.value){var b=i.parentNode.querySelector(".pw-eye");i.type="password";b.classList.remove("on");b.setAttribute("aria-pressed","false");b.setAttribute("aria-label","Show password")}})});
  document.getElementById("so").onclick=async function(){await SOLDB.signOut();location.href="index.html"};
  document.getElementById("an").onclick=function(){form({})};
  list();
})();
async function list(){
  var a=await SOLDB.listAddresses(),el=document.getElementById("al");
  el.innerHTML=a.length?a.map(function(x){return '<div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div style="font-size:13px"><b style="font-weight:500">'+SOL.esc(x.address_line)+'</b>'+'<br><span class="muted">'+SOL.esc(x.city+", "+x.province+" "+(x.postal_code||""))+(x.label?'<br>Landmark: '+SOL.esc(x.label):'')+'</span></div><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:14px;align-items:start"><a href="#" data-e="'+x.id+'">Edit</a>'+'<a href="#" data-x="'+x.id+'">Delete</a></div></div>'}).join(""):'<p class="muted" style="margin:0">No saved addresses yet.</p>';
  el.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(e){e.preventDefault();form(a.filter(function(x){return x.id===b.dataset.e})[0])}});
  el.querySelectorAll("[data-d]").forEach(function(b){b.onclick=async function(e){e.preventDefault();await SOLDB.makeDefault(b.dataset.d);list()}});
  document.getElementById("an").classList.toggle("hide",a.length>0);
  el.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(e){e.preventDefault();window.solModal("Delete address",'<p class="muted" style="margin:10px 0 0;font-size:14px;line-height:1.6">This will remove your saved address. You can add a new one afterwards.</p>',"Delete",async function(){await SOLDB.deleteAddress(b.dataset.x);list();return null})}});
}
function form(x){
  x=x||{};var md=window.solMd||{};
  function i(l,k,req){return '<label>'+l+(req?'':' (optional)')+'</label><input data-k="'+k+'" type="text" value="'+SOL.esc(x[k]||"")+'">'}
  window.solModal(x.id?"Edit address":"Add address",i("Street address","address_line",1)+i("City","city",1)+i("Province","province",1)+i("Postal code","postal_code")+i("Landmark","label"),"Save address",async function(o){
    var a={id:x.id};o.querySelectorAll("input[data-k]").forEach(function(n){a[n.dataset.k]=n.value.trim()});
    if(!a.address_line||!a.city||!a.province)return"Please fill in street address, city and province.";
    a.full_name=md.full_name||x.full_name||"";a.phone=md.phone||x.phone||"";
    if(!a.full_name||!a.phone)return"Add your full name and mobile number in Profile first, then save.";
    await SOLDB.saveAddress(a);list();return null});
}
</script></body></html>
