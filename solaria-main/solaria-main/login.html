<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>Sign in | Solaria Parfums</title><meta name="description" content="Solaria Parfums - luxury-inspired fragrances, made accessible. Delivered across the Philippines."><meta property="og:site_name" content="Solaria Parfums"><meta property="og:title" content="Sign in | Solaria Parfums"></head>
<body data-nav=""><div id="hdr"></div><main>
<section class="sec"><div class="wrap" style="max-width:440px">
<div class="center"><img class="logo-img" src="logo-emblem.png" alt="" style="width:76px;margin:0 auto 22px"><p class="eyebrow" id="eb">Welcome back</p><h2 id="tt">Sign in</h2><div class="rule"></div></div>
<div id="f"></div><div class="err center" id="er"></div>
</div></section>
</main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script src="cart.js"></script><script src="layout.js"></script><script>
var mode="in",f=document.getElementById("f"),er=document.getElementById("er");
var next=new URLSearchParams(location.search).get("next")||"account.html";
if(!/^[a-z0-9_\-]+\.html(\?[^#]*)?$/i.test(next))next="account.html";
function fld(l,i,t,ac){return '<label>'+l+'</label><input id="'+i+'" type="'+t+'" autocomplete="'+(ac||"off")+'">'}
var EYE='<button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false"><svg class="eye-on" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></button>';
function pwf(l,i,ac){return '<label>'+l+'</label><div class="pw-wrap"><input id="'+i+'" type="password" placeholder=" " autocomplete="'+ac+'">'+EYE+'</div>'}
function show(m){mode=m;er.textContent="";er.className="err center";
  var T={in:["Welcome back","Sign in"],up:["Join Solaria","Create account"],fg:["Forgot password","Reset password"],rs:["New password","Choose a new password"]}[m];
  document.getElementById("eb").textContent=T[0];document.getElementById("tt").textContent=T[1];
  f.innerHTML=(m==="up"?fld("Full name","nm","text","name")+fld("Username","un","text","username")+'<div class="muted hint">3-20 characters: lowercase letters, numbers, _ or . (no spaces)</div>':"")+(m!=="rs"?fld("Email","em","email","email"):"")+(m!=="fg"?pwf("Password","pw",m==="in"?"current-password":"new-password"):"")+(m==="up"||m==="rs"?'<div class="muted hint">'+SOL.PWHINT+'</div>'+pwf("Confirm password","cpw","new-password"):"")+(m==="up"?'<label>Mobile number (optional)</label>'+SOL.phoneHTML("ph"):"")+
   '<button class="btn block" id="go" style="margin-top:28px">'+T[1]+'</button><p class="center muted" style="margin-top:24px;font-size:12px">'+
   (m==="in"?'<a href="#" id="l1" style="color:var(--gold)">Forgot password?</a><br><br>New here? <a href="#" id="l2" style="color:var(--gold)">Create an account</a>':'<a href="#" id="l2" style="color:var(--gold)">Back to sign in</a>')+'</p>';
  f.querySelectorAll(".pw-eye").forEach(function(b){b.onclick=function(){var i=b.parentNode.querySelector("input"),sh=i.type==="password";i.type=sh?"text":"password";b.classList.toggle("on",sh);b.setAttribute("aria-pressed",sh);b.setAttribute("aria-label",sh?"Hide password":"Show password")}});
  f.querySelectorAll(".pw-wrap input").forEach(function(i){i.addEventListener("input",function(){if(!i.value){var b=i.parentNode.querySelector(".pw-eye");i.type="password";b.classList.remove("on");b.setAttribute("aria-pressed","false");b.setAttribute("aria-label","Show password")}})});
  SOL.phoneBind("ph");
  document.getElementById("go").onclick=go;var l1=document.getElementById("l1"),l2=document.getElementById("l2");
  if(l1)l1.onclick=function(e){e.preventDefault();show("fg")};if(l2)l2.onclick=function(e){e.preventDefault();show(m==="in"?"up":"in")};
}
function v(i){return(document.getElementById(i)||{}).value||""}
async function go(){
  er.textContent="";if(!SOLDB.ok){er.textContent="The shop is not connected yet.";return}
  var b=document.getElementById("go");b.disabled=true;
  try{
    if(mode==="in"){await SOLDB.signIn(v("em").trim(),v("pw"));location.href=next}
    else if(mode==="up"){var un=v("un").trim(),ph=SOL.phoneVal("ph");
      var pe=SOL.userCheck(un)||SOL.pwCheck(v("pw"),[v("em"),un]);if(pe)throw{message:"v:"+pe};if(v("pw")!==v("cpw"))throw{message:"mismatch"};
      if(ph===null)throw{message:"v:Enter a valid mobile number, check the number matches the selected country."};
      var r=await SOLDB.signUp(v("em").trim(),v("pw"),{full_name:v("nm").trim(),username:un,phone:ph});
      if(r.session)location.href=next;else{er.className="err ok center";er.textContent="Check your email to confirm your account, then sign in.";show("in");er.className="err ok center";er.textContent="Check your email to confirm your account, then sign in."}}
    else if(mode==="fg"){await SOLDB.resetPassword(v("em").trim());er.className="err ok center";er.textContent="If that email has an account, a reset link is on its way."}
    else{var pe2=SOL.pwCheck(v("pw"));if(pe2)throw{message:"v:"+pe2};if(v("pw")!==v("cpw"))throw{message:"mismatch"};await SOLDB.setPassword(v("pw"));location.href="account.html"}
  }catch(e){var m=String(e.message||e);er.textContent=m.indexOf("v:")===0?m.slice(2):m==="short"?"Password must be at least 8 characters.":m==="mismatch"?"Passwords do not match.":/invalid login/i.test(m)?"Incorrect email or password.":/confirm/i.test(m)?"Please confirm your email first.":"Something went wrong. Please try again."}
  b.disabled=false;
}
show("in");
if(SOLDB.ok){SOLDB.client.auth.onAuthStateChange(function(ev){if(ev==="PASSWORD_RECOVERY")show("rs")});
  SOLDB.session().then(function(s){if(s&&mode==="in"&&!/type=recovery/.test(location.hash))location.href=next})}
</script></body></html>
