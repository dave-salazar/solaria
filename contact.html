<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>Contact | Solaria Parfums</title><meta name="description" content="Solaria Parfums - luxury-inspired fragrances, made accessible. Delivered across the Philippines."><meta property="og:site_name" content="Solaria Parfums"><meta property="og:title" content="Contact | Solaria Parfums"></head>
<body data-nav="contact"><div id="hdr"></div><main>
<section class="page-head"><div class="wrap"><p class="eyebrow">We would love to hear from you</p><h1>Contact</h1></div></section>
<div class="wrap" style="max-width:560px;padding-top:56px;padding-bottom:96px">
<p class="muted center">Email us at <a href="mailto:solariasupport@gmail.com" style="color:var(--gold)">solariasupport@gmail.com</a> or follow <b style="font-weight:500">@solaria</b>, or send a message below.</p><div class="rule" style="margin-left:auto;margin-right:auto"></div>
<label>Name</label><input id="cn" type="text" maxlength="80"><label>Email</label><input id="ce" type="email" maxlength="120"><label>Message</label><textarea id="cm" maxlength="2000"></textarea>
<div class="err" id="cr"></div><button class="btn block" id="cs" style="margin-top:14px">Send message</button></div>
</main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script src="cart.js"></script><script src="layout.js"></script><script>
document.getElementById("cs").onclick=async function(){
  var n=document.getElementById("cn").value.trim(),e=document.getElementById("ce").value.trim(),m=document.getElementById("cm").value.trim(),r=document.getElementById("cr");r.className="err";
  if(!n||!/^\S+@\S+\.\S+$/.test(e)||m.length<5){r.textContent="Please enter your name, a valid email and a message.";return}
  if(!SOLDB.ok){r.textContent="Please email us directly at solariasupport@gmail.com.";return}
  try{await SOLDB.sendMessage({name:n,email:e,message:m});r.className="err ok";r.textContent="Thank you. We will reply soon.";document.getElementById("cm").value=""}catch(x){r.textContent="Could not send your message. Please email us directly."}
};
</script></body></html>
