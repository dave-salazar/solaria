<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="solaria.css">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sol-theme")||"dark")}catch(e){}</script>
<title>My account | Solaria Parfums</title><meta name="description" content="Solaria Parfums - luxury-inspired fragrances, made accessible. Delivered across the Philippines."><meta property="og:site_name" content="Solaria Parfums"><meta property="og:title" content="My account | Solaria Parfums"></head>
<body data-nav=""><div id="hdr"></div><main>
<section class="page-head"><div class="wrap"><p class="eyebrow">Account</p><h1>My account</h1></div></section>
<section class="sec" style="padding-top:48px"><div class="wrap" style="max-width:820px" id="ar"></div></section>
</main><div id="ftr"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="db.js"></script><script src="cart.js"></script><script src="layout.js"></script><script>
var ar=document.getElementById("ar"),user=null;
function pw(id){return '<div class="pw-wrap"><input id="'+id+'" type="password" placeholder=" " autocomplete="new-password"><button type="button" class="pw-eye" aria-label="Show password" aria-pressed="false"><svg class="eye-on" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg></button></div>'}
(async function(){
  if(!SOLDB.ok){ar.innerHTML='<p class="muted center">The shop is not connected yet.</p>';return}
  user=await SOLDB.requireLogin("account.html");if(!user)return;
  var admin=await SOLDB.isAdmin(),md=user.user_metadata||{};
  ar.innerHTML='<div class="panel"><h3>Profile</h3><div class="rule"></div><p class="muted" style="margin:0 0 6px">'+SOL.esc(user.email)+'</p><label>Full name</label><input id="pn" type="text" value="'+SOL.esc(md.full_name||"")+'"><label>Mobile number</label>'+SOL.phoneHTML("pp",md.phone)+'<div class="err" id="pe"></div><button class="btn sm" id="ps">Save</button></div>'+
   '<div class="panel" style="margin-top:28px"><h3>Addresses</h3><div class="rule"></div><div id="al"></div><button class="btn sm ghost" id="an" style="margin-top:14px">Add address</button><div id="af" class="hide"></div></div>'+
   '<div class="panel" style="margin-top:28px"><h3>Password</h3><div class="rule"></div><label>New password</label>'+pw("np")+'<label>Confirm new password</label>'+pw("cp")+'<div class="muted hint">'+SOL.PWHINT+'</div><div class="err" id="we"></div><button class="btn sm" id="ws">Update password</button></div>'+
   '<div style="margin-top:32px;display:flex;gap:14px;flex-wrap:wrap"><a class="btn ghost sm" href="orders.html">My orders</a>'+(admin?'<a class="btn ghost sm" href="admin.html">Admin</a>':'')+'<button class="btn ghost sm" id="so">Sign out</button></div>';
  SOL.phoneBind("pp");
  document.getElementById("ps").onclick=async function(){var ph=SOL.phoneVal("pp");if(ph===null){document.getElementById("pe").textContent="Enter a valid mobile number for the selected country.";return}document.getElementById("pe").textContent="";try{await SOLDB.updateProfile({full_name:document.getElementById("pn").value,phone:ph});SOL.toast("Profile saved")}catch(e){document.getElementById("pe").textContent="Could not save."}};
  ar.querySelectorAll(".pw-eye").forEach(function(b){b.onclick=function(){var i=b.parentNode.querySelector("input"),show=i.type==="password";i.type=show?"text":"password";b.classList.toggle("on",show);b.setAttribute("aria-pressed",show);b.setAttribute("aria-label",show?"Hide password":"Show password")}});
  ar.querySelectorAll(".pw-wrap input").forEach(function(i){i.addEventListener("input",function(){if(!i.value){var b=i.parentNode.querySelector(".pw-eye");i.type="password";b.classList.remove("on");b.setAttribute("aria-pressed","false");b.setAttribute("aria-label","Show password")}})});
  document.getElementById("ws").onclick=async function(){var p=document.getElementById("np").value,c=document.getElementById("cp").value,e=document.getElementById("we");var pe=SOL.pwCheck(p,[user.email,md.username]);if(pe){e.textContent=pe;return}if(p!==c){e.textContent="Passwords do not match.";return}try{await SOLDB.setPassword(p);e.textContent="";document.getElementById("np").value="";document.getElementById("cp").value="";SOL.toast("Password updated")}catch(x){e.textContent="Could not update password."}};
  document.getElementById("so").onclick=async function(){await SOLDB.signOut();location.href="index.html"};
  document.getElementById("an").onclick=function(){form({})};
  list();
})();
async function list(){
  var a=await SOLDB.listAddresses(),el=document.getElementById("al");
  el.innerHTML=a.length?a.map(function(x){return '<div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div style="font-size:13px"><b style="font-weight:500">'+SOL.esc(x.label||x.full_name)+'</b>'+(x.is_default?' <span class="muted">&middot; default</span>':'')+'<br><span class="muted">'+SOL.esc(x.full_name+", "+x.phone)+'<br>'+SOL.esc(x.address_line+", "+x.city+", "+x.province+" "+(x.postal_code||""))+'</span></div><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:14px;align-items:start"><a href="#" data-e="'+x.id+'">Edit</a>'+(x.is_default?'':'<a href="#" data-d="'+x.id+'">Make default</a>')+'<a href="#" data-x="'+x.id+'">Delete</a></div></div>'}).join(""):'<p class="muted" style="margin:0">No saved addresses yet.</p>';
  el.querySelectorAll("[data-e]").forEach(function(b){b.onclick=function(e){e.preventDefault();form(a.filter(function(x){return x.id===b.dataset.e})[0])}});
  el.querySelectorAll("[data-d]").forEach(function(b){b.onclick=async function(e){e.preventDefault();await SOLDB.makeDefault(b.dataset.d);list()}});
  el.querySelectorAll("[data-x]").forEach(function(b){b.onclick=async function(e){e.preventDefault();if(confirm("Delete this address?")){await SOLDB.deleteAddress(b.dataset.x);list()}}});
}
function form(x){
  var f=document.getElementById("af");f.classList.remove("hide");
  function i(l,k,t){return '<label>'+l+'</label><input data-k="'+k+'" type="'+(t||"text")+'" value="'+SOL.esc(x[k]||"")+'">'}
  f.innerHTML=i("Label (Home, Office)","label")+i("Full name","full_name")+i("Mobile number","phone","tel")+i("Street address","address_line")+i("City","city")+i("Province","province")+i("Postal code","postal_code")+'<div class="err" id="ae"></div><button class="btn sm" id="asv">Save address</button>';
  document.getElementById("asv").onclick=async function(){
    var a={id:x.id};f.querySelectorAll("input").forEach(function(n){a[n.dataset.k]=n.value.trim()});
    if(!a.full_name||!a.phone||!a.address_line||!a.city||!a.province){document.getElementById("ae").textContent="Please fill in all required fields.";return}
    try{await SOLDB.saveAddress(a);f.classList.add("hide");list()}catch(e){document.getElementById("ae").textContent="Could not save address."}};
}
</script></body></html>
